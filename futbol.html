<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Dünyası - Ahmet Aziz Uyar</title>
    <!-- Bootstrap bağlantısı -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Kendi stil dosyam -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">

    <!-- Üst menü -->
    <header class="py-4 border-bottom d-flex justify-content-between align-items-center">
        <h1 class="m-0">Ahmet Aziz Uyar</h1>
        <nav>
            <a href="index.html" class="text-decoration-none me-3">Ana Sayfa</a>
            <a href="sehrim.html" class="text-decoration-none me-3">Şehrim</a>
            <a href="futbol.html" class="text-decoration-none me-3">Futbol</a>
            <a href="iletisim.html" class="text-decoration-none me-3">İletişim</a>
            <a href="login.html" class="btn btn-outline-primary">Giriş Yap</a>
        </nav>
    </header>

    <!-- Futbol arama alanı -->
    <section id="ilgi-alanlarim" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">İlgi Alanlarım: Futbol Dünyası</h2>
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <p>İstediğiniz Dünya yıldızlarının isimlerini yazarak bilgilerini öğrenin</p>
                    
                    <div class="input-group mb-3 shadow-sm">
                        <input type="text" id="playerName" class="form-control" placeholder="Örn: Lionel Messi, Cristiano Ronaldo, Icardi..." value="Lionel Messi">
                        <button class="btn btn-success" type="button" onclick="fetchPlayerData()">Futbolcu Ara</button>
                    </div>
                    
                    <div id="apiResult" class="mt-4"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Sayfa altı -->
    <footer class="py-3 text-center border-top mt-5">
        <p>2026 - Ahmet Aziz Uyar</p>
    </footer>

    <!-- Api bağlantı scripti -->
    <script>
        function fetchPlayerData() {
            const playerInput = document.getElementById('playerName').value;
            const resultDiv = document.getElementById('apiResult');

            if(playerInput === "") {
                resultDiv.innerHTML = '<div class="alert alert-warning">Lütfen bir futbolcu adı girin!</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="spinner-border text-success" role="status"></div><p class="mt-2">Veriler çekiliyor...</p>';

            fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${playerInput}`)
                .then(response => response.json())
                .then(data => {
                    if (data.player && data.player.length > 0) {
                        const player = data.player[0]; 
                        const imageUrl = player.strThumb ? player.strThumb : 'https://via.placeholder.com/300x300?text=Fotograf+Yok';
                        
                        resultDiv.innerHTML = `
                            <div class="card shadow border-0 mx-auto" style="max-width: 18rem; border-radius: 15px;">
                                <img src="${imageUrl}" class="card-img-top rounded-top" alt="${player.strPlayer}">
                                <div class="card-body bg-dark text-white rounded-bottom">
                                    <h5 class="card-title text-success fw-bold">${player.strPlayer}</h5>
                                    <ul class="list-unstyled mb-0 text-start">
                                        <li><strong>Takım:</strong> ${player.strTeam || 'Bilinmiyor'}</li>
                                        <li><strong>Milli Takım:</strong> ${player.strNationality}</li>
                                        <li><strong>Mevki:</strong> ${player.strPosition}</li>
                                        <li><strong>Doğum Tarihi:</strong> ${player.dateBorn || 'Bilinmiyor'}</li>
                                    </ul>
                                </div>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = '<div class="alert alert-danger shadow-sm">Oyuncu bulunamadı. Lütfen İngilizce karakterlerle veya tam adıyla tekrar deneyin.</div>';
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = '<div class="alert alert-danger shadow-sm">API bağlantısında bir hata oluştu!</div>';
                });
        }

        document.addEventListener("DOMContentLoaded", function() {
            fetchPlayerData();
        });
    </script>

</body>
</html>
