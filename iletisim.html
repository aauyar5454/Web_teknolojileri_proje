<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim - Ahmet Aziz Uyar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="container">

    <header class="py-4 border-bottom d-flex justify-content-between align-items-center">
        <h1 class="m-0">Ahmet Aziz Uyar</h1>
        <nav>
            <a href="index.html" class="text-decoration-none me-3 text-dark">Ana Sayfa</a>
            <a href="sehrim.html" class="text-decoration-none me-3 text-dark">Şehrim</a>
            <a href="futbol.html" class="text-decoration-none me-3 text-dark">Futbol</a>
            <a href="iletisim.html" class="text-decoration-none me-3 fw-bold text-primary">İletişim</a>
            <a href="login.html" class="btn btn-outline-primary">Giriş Yap</a>
        </nav>
    </header>

    <section id="iletisim" class="py-5">
        <h2>İletişim</h2>
        <div class="row" id="app">
            <div class="col-lg-8 mx-auto">
                <form id="contactForm" ref="contactForm" action="gonder.php" method="POST" class="shadow p-4 rounded bg-white">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Ad Soyad</label>
                        <input type="text" class="form-control" id="name" name="name" v-model="form.name" placeholder="Adınızı giriniz">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresi</label>
                        <input type="email" class="form-control" id="email" name="email" v-model="form.email" placeholder="örnek@gmail.com">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Telefon Numarası</label>
                        <input type="text" class="form-control" id="phone" name="phone" v-model="form.phone" placeholder="Sadece rakam giriniz">
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Mesaj Konusu</label>
                        <select class="form-select" id="subject" name="subject" v-model="form.subject">
                            <option value="">Seçiniz...</option>
                            <option value="bilgi">Bilgi Almak İstiyorum</option>
                            <option value="proje">Proje Hakkında</option>
                            <option value="diger">Diğer</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Cinsiyet</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="erkek" value="erkek" v-model="form.gender">
                            <label class="form-check-label" for="erkek">Erkek</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="kadin" value="kadin" v-model="form.gender">
                            <label class="form-check-label" for="kadin">Kadın</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">İlgi Duyduğunuz Teknolojiler</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="interest[]" id="web" value="web" v-model="form.interests">
                            <label class="form-check-label" for="web">Web Teknolojileri</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="interest[]" id="robot" value="robot" v-model="form.interests">
                            <label class="form-check-label" for="robot">Robotik</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="interest[]" id="ai" value="ai" v-model="form.interests">
                            <label class="form-check-label" for="ai">Yapay Zeka</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="interest[]" id="3d" value="3d" v-model="form.interests">
                            <label class="form-check-label" for="3d">3D Tasarım ve Baskı</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Mesajınız</label>
                        <textarea class="form-control" id="message" name="message" rows="4" v-model="form.message"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                        <button type="button" onclick="validateWithJS()" class="btn btn-primary">JS ile Denetle</button>
                        
                        <button type="button" @click="validateWithVue" class="btn btn-success">Vue.js ile Denetle</button>
                        
                        <button type="reset" class="btn btn-secondary">Temizle</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="py-3 text-center border-top">
        <p>2026 - Ahmet Aziz Uyar</p>
    </footer>

    <script>
        // 1. NATIVE JS KONTROLÜ (1. Buton için)
        function validateWithJS() {
            // Form elemanlarını çekiyoruz
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const gender = document.querySelector('input[name="gender"]:checked'); // Seçili radio butonu bulur

            // Boş alan kontrolü
            if(name === "" || email === "" || phone === "" || subject === "" || !gender || message === "") {
                alert("JS Uyarısı: Lütfen tüm alanları doldurunuz!");
                return;
            }

            // E-posta format kontrolü (içinde @ ve . olmalı)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailPattern.test(email)) {
                alert("JS Uyarısı: Geçerli bir e-posta adresi giriniz!");
                return;
            }

            // Telefon numarası sadece rakam kontrolü
            const phonePattern = /^[0-9]+$/;
            if(!phonePattern.test(phone)) {
                alert("JS Uyarısı: Telefon numarası sadece rakamlardan oluşmalıdır!");
                return;
            }

            // Hata yoksa formu gönder
            alert("JS Denetimi Başarılı! Veriler sunucuya gönderiliyor...");
            document.getElementById('contactForm').submit();
        }

        // 2. VUE.JS KONTROLÜ (2. Buton için)
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // Formdaki tüm veriler anlık olarak burada tutulur
                    form: {
                        name: '',
                        email: '',
                        phone: '',
                        subject: '',
                        gender: '',
                        interests: [],
                        message: ''
                    }
                }
            },
            methods: {
                validateWithVue() {
                    // Boş alan kontrolü
                    if(!this.form.name || !this.form.email || !this.form.phone || !this.form.subject || !this.form.gender || !this.form.message) {
                        alert("Vue.js Uyarısı: Lütfen tüm alanları doldurunuz!");
                        return;
                    }

                    // E-posta format kontrolü
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if(!emailPattern.test(this.form.email)) {
                        alert("Vue.js Uyarısı: Geçerli bir e-posta adresi giriniz!");
                        return;
                    }

                    // Telefon numarası sadece rakam kontrolü
                    const phonePattern = /^[0-9]+$/;
                    if(!phonePattern.test(this.form.phone)) {
                        alert("Vue.js Uyarısı: Telefon numarası sadece rakamlardan oluşmalıdır!");
                        return;
                    }

                    // Hata yoksa Vue referansıyla formu gönder
                    alert("Vue.js Denetimi Başarılı! Veriler sunucuya gönderiliyor...");
                    this.$refs.contactForm.submit();
                }
            }
        }).mount('#app'); // id="app" olan kapsayıcıyı Vue yönetimine alıyoruz
    </script>

</body>
</html>
